<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たなかAIカンパニー オフィス</title>
<style>
  :root {
    --cream: #fff8ee;
    --paper: #ffffff;
    --ink: #4a3426;
    --ink-soft: #8a6d58;
    --shiba: #e89b4f;
    --shiba-deep: #c97a32;
    --mint: #8fd3b6;
    --pink: #e9a3b6;
    --pink-deep: #c9607e;
    --line: #f0dcc4;
    --off: #e6d9c8;
    --shadow: 0 6px 24px rgba(120, 72, 30, .16);
    --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, #fffaf2 0%, #fbeedd 60%, #f3dfc6 100%);
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }

  /* 名札・吹き出し（3Dの位置に合わせて動かす） */
  .float { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; display: none; }
  .nametag {
    background: var(--paper); border: 2px solid var(--shiba); color: var(--ink);
    border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .nametag::before { content: "🐾 "; }
  .nametag.mochi { border-color: var(--pink); }
  .nametag.mochi::before { content: "🌸 "; }
  .bubble {
    background: var(--paper); color: var(--ink); border-radius: 16px; padding: 8px 14px;
    font-size: 14px; font-weight: 700; max-width: 240px; line-height: 1.45; box-shadow: var(--shadow);
    border: 2px solid var(--line);
  }
  .bubble::after {
    content: ""; position: absolute; left: -9px; bottom: 10px; border: 8px solid transparent;
    border-right-color: var(--paper); border-left: 0;
  }
  .bubble.trouble { border-color: #b9c7e8; }

  /* 画面の隅の小さな表示 */
  #hud {
    position: fixed; left: 14px; top: 14px; background: rgba(255,255,255,.88); backdrop-filter: blur(6px);
    border-radius: 18px; padding: 10px 14px; box-shadow: var(--shadow); min-width: 190px; z-index: 5;
  }
  #hud .co { font-weight: 800; font-size: 14px; letter-spacing: .02em; }
  #hud .co::before { content: "🐕 "; }
  #hud .date { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #hud .count { display: inline-flex; align-items: baseline; gap: 4px; margin-top: 6px; font-weight: 800; }
  #hud .count b { font-size: 26px; color: var(--shiba-deep); line-height: 1; }
  #hud .count.state b { font-size: 16px; }
  #hud .week { display: flex; gap: 6px; margin-top: 8px; }
  #hud .dot { width: 18px; text-align: center; font-size: 9px; color: var(--ink-soft); }
  #hud .dot i { display: block; width: 14px; height: 14px; margin: 0 auto 2px; border-radius: 50%; background: var(--off); }
  #hud .dot.on i { background: var(--shiba); box-shadow: 0 0 0 2px #fde3c6; }
  #hud .dot.pink.on i { background: var(--pink); box-shadow: 0 0 0 2px #fbe1e8; }
  #hud .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  #hud .who b { color: var(--ink); font-size: 12px; }
  #hud .who .st { font-weight: 800; color: var(--shiba-deep); }
  #hud .who .st.pink { color: var(--pink-deep); }
  #hud .dot.today i { outline: 2px solid var(--ink-soft); outline-offset: 1px; }
  #hint {
    position: fixed; right: 14px; bottom: 12px; font-size: 11px; color: var(--ink-soft);
    background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 999px; z-index: 5;
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink-soft); pointer-events: none; }

  /* 3Dが使えないときの表示 */
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 90px 16px 40px; overflow: auto;
  }
  #fallback .card { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; width: min(520px, 100%); }
  #fallback .note { font-size: 12px; color: var(--ink-soft); }
  #fallback .big { font-size: 22px; font-weight: 800; margin: 8px 0 12px; }
  #fallback .big.second { margin-top: 22px; font-size: 18px; }

  /* ポップアップ */
  #modal { position: fixed; inset: 0; background: rgba(74, 52, 38, .35); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal.open { display: flex; }
  #modal .sheet { background: var(--cream); border-radius: 22px; box-shadow: var(--shadow); width: min(480px, 100%); max-height: 88vh; overflow: auto; padding: 18px; position: relative; }
  #modal .close { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--ink-soft); }
  .mtitle { font-weight: 800; font-size: 17px; margin: 0 0 12px; }
  .mtitle small { font-weight: 400; color: var(--ink-soft); font-size: 12px; margin-left: 6px; }
  .ncard { display: flex; gap: 12px; align-items: center; background: var(--paper); border-radius: 16px; padding: 12px; margin-bottom: 10px; border: 2px solid var(--line); }
  .ncard .ic { font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; background: #fff3e4; border-radius: 12px; flex: none; }
  .ncard .hd { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .ncard.pink { border-color: #f6d3dc; }
  .ncard.pink .ic { background: #fdebef; }
  .btn.pink { background: var(--pink-deep); }
  .ncard .sub { font-size: 12px; color: var(--ink-soft); }
  .ncard a { font-size: 12px; color: var(--shiba-deep); word-break: break-all; }
  .btn { display: inline-block; margin-top: 6px; background: var(--shiba); color: #fff; font-weight: 800; text-decoration: none; padding: 9px 16px; border-radius: 999px; font-size: 14px; }
  .empty { background: var(--paper); border-radius: 16px; padding: 18px; text-align: center; font-weight: 700; margin-bottom: 10px; }
  .idcard { display: flex; gap: 14px; align-items: center; background: var(--paper); border-radius: 18px; padding: 14px; border-top: 10px solid var(--shiba); }
  .idcard svg { flex: none; }
  .idcard.mochi { border-top-color: var(--pink); }
  .idcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .idcard dt { color: var(--ink-soft); }
  .idcard dd { margin: 0; font-weight: 700; }
  .idcard .nm { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">オフィスを準備中…</div>
<div id="labels"></div>
<div id="hud"></div>
<div id="hint">ドラッグで回転・ホイールで拡大／報告書や社員をクリック</div>
<div id="fallback"><div class="card" id="fallbackCard"></div></div>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet"><button class="close" aria-label="閉じる">×</button><div id="modalBody"></div></div></div>

<script>
(function () {
  "use strict";

  // ---------- データの読み込み ----------
  var DATA;
  try { DATA = JSON.parse(document.getElementById("news-data").textContent); }
  catch (e) { DATA = { company: "たなかAIカンパニー", employee: { name: "ニュースくん", role: "AIニュース担当", hours: "毎朝 7:00（日本時間）" }, days: [] }; }
  var EMP = DATA.employee || {};
  var FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif';

  // ---------- 日本時間 ----------
  var fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  function jst(d) {
    d = d || new Date();
    var o = {};
    fmt.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
    return { y: +o.year, m: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, ms: d.getMilliseconds() };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(y, m, d) { var t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() + "-" + pad(t.getUTCMonth() + 1) + "-" + pad(t.getUTCDate()); }
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function weekday(y, m, d) { return WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; }

  var NOW = jst();
  var TODAY = ymd(NOW.y, NOW.m, NOW.d);
  var dayMap = {};
  (DATA.days || []).forEach(function (d) { dayMap[d.date] = d; });
  var today = dayMap[TODAY] || null;
  var news = (today && today.status === "reported" && today.news) ? today.news.slice(0, 5) : [];
  var STATE = !today ? "before" : (today.status === "search_failed" ? "failed" : (today.status === "reported" && news.length ? "reported" : "nonews"));

  var STATE_LABEL = { before: "出社前", reported: news.length + "件", nonews: "異常なし", failed: "検索失敗" };
  var DEFAULT_MSG = {
    before: "",
    reported: "社長！今日は" + news.length + "件です！",
    nonews: "社長！今日は新しいニュースはありません。異常なしです！",
    failed: "社長、すみません…今日は検索がうまくいきませんでした"
  };
  var MESSAGE = (today && today.message) || DEFAULT_MSG[STATE];
  var CAT = {
    chatgpt: { icon: "💬", label: "ChatGPT" },
    claude: { icon: "✳️", label: "Claude" },
    image: { icon: "🎨", label: "画像生成" },
    efficiency: { icon: "⚡", label: "仕事効率化" },
    other: { icon: "📰", label: "その他" }
  };

  // ---------- もち（SNS投稿担当）のデータ ----------
  var SDATA;
  try { SDATA = JSON.parse(document.getElementById("sns-data").textContent); } catch (e) { SDATA = { days: [] }; }
  var SEMP = SDATA.employee || { name: "もち", role: "SNS投稿担当", hours: "毎朝 7:00（日本時間）" };
  var sDayMap = {};
  (SDATA.days || []).forEach(function (d) { sDayMap[d.date] = d; });
  var sToday = sDayMap[TODAY] || null;
  var drafts = (sToday && sToday.status === "drafted" && sToday.drafts) ? sToday.drafts.slice(0, 3) : [];
  var SSTATE = !sToday ? "before" : (sToday.status === "drafted" && drafts.length ? "drafted" : "failed");
  var SSTATE_LABEL = { before: "出社前", drafted: drafts.length + "案", failed: "作成失敗" };
  var SMESSAGE = (sToday && sToday.message) || {
    before: "",
    drafted: "社長〜、今日の投稿案を" + drafts.length + "つご用意しましたよ〜",
    failed: "社長、すみません…今日はうまく作れませんでした〜"
  }[SSTATE];
  var PLAT = {
    instagram: { icon: "📷", label: "Instagram" },
    x: { icon: "✖️", label: "X" },
    google: { icon: "📍", label: "Googleビジネスプロフィール" },
    line: { icon: "💬", label: "LINE" }
  };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

  // ---------- 隅の表示（3Dがなくても必ず出す） ----------
  function weekDots(map, cls) {
    var j = jst(), html = '<div class="week">';
    for (var i = 6; i >= 0; i--) {
      var ds = ymd(j.y, j.m, j.d - i);
      var t = new Date(Date.UTC(j.y, j.m - 1, j.d - i));
      var on = !!map[ds];
      html += '<div class="dot ' + cls + (on ? " on" : "") + (i === 0 ? " today" : "") + '" title="' + ds + (on ? " 出勤" : " 記録なし") + '"><i></i>' + WD[t.getUTCDay()] + "</div>";
    }
    return html + "</div>";
  }
  function renderHUD() {
    var j = jst();
    var html = '<div class="co">' + esc(DATA.company) + '</div>';
    html += '<div class="date">' + j.y + "年" + j.m + "月" + j.d + "日（" + weekday(j.y, j.m, j.d) + "）</div>";
    if (STATE === "reported") html += '<div class="count"><span>今日</span><b>' + news.length + '</b><span>件</span></div>';
    else html += '<div class="count state"><span>今日</span><b>' + STATE_LABEL[STATE] + '</b></div>';
    html += '<div class="who"><b>🐕 ' + esc(EMP.name) + '</b><span class="st">' + (STATE === "reported" ? "ニュース " : "") + STATE_LABEL[STATE] + "</span></div>";
    html += weekDots(dayMap, "");
    html += '<div class="who"><b>🌸 ' + esc(SEMP.name) + '</b><span class="st pink">' + (SSTATE === "drafted" ? "投稿案 " : "") + SSTATE_LABEL[SSTATE] + "</span></div>";
    html += weekDots(sDayMap, "pink");
    document.getElementById("hud").innerHTML = html;
  }

  // ---------- 見出しカード・社員証 ----------
  function reportFileLink() {
    var f = (today && today.report_file) || ("報告/" + TODAY + "_AIニュース.md");
    return encodeURI(f);
  }
  function newsCardsHTML() {
    var h = "";
    if (STATE === "reported") {
      news.forEach(function (n) {
        var c = CAT[n.category] || CAT.other;
        h += '<div class="ncard"><div class="ic" title="' + esc(c.label) + '">' + c.icon + '</div><div><div class="hd">' + esc(n.headline) + '</div>' +
          '<a href="' + esc(safeUrl(n.url)) + '" target="_blank" rel="noopener">出典：' + esc(n.source) + "</a></div></div>";
      });
    } else {
      var t = { before: "🕖 まだ出社前です", nonews: "✅ 異常なし（新しいニュースなし）", failed: "😥 検索に失敗しました" }[STATE];
      h += '<div class="empty">' + t + "</div>";
    }
    if (today) h += '<a class="btn" href="' + reportFileLink() + '" target="_blank">📄 報告ファイルを開く</a>';
    return h;
  }
  function openReports() {
    var j = jst();
    openModal('<p class="mtitle">📋 今日の報告<small>' + j.m + "/" + j.d + "・" + STATE_LABEL[STATE] + "</small></p>" + newsCardsHTML());
  }
  function draftsFileLink() {
    return encodeURI((sToday && sToday.drafts_file) || ("SNS/" + TODAY + "_SNS投稿案.md"));
  }
  function draftCardsHTML() {
    var h = "";
    if (SSTATE === "drafted") {
      drafts.forEach(function (d) {
        var pl = PLAT[d.platform] || { icon: "📝", label: "SNS" };
        h += '<div class="ncard pink"><div class="ic" title="' + esc(pl.label) + '">' + pl.icon + '</div><div><div class="hd">' + esc(d.title) + '</div><div class="sub">' + esc(pl.label) + "向け</div></div></div>";
      });
    } else {
      h += '<div class="empty">' + (SSTATE === "before" ? "🕖 もちはまだ出社前です" : "😥 今日は投稿案を作れませんでした") + "</div>";
    }
    if (sToday) h += '<a class="btn pink" href="' + draftsFileLink() + '" target="_blank">📝 投稿案ファイルを開く</a>';
    return h;
  }
  function openDrafts() {
    var j = jst();
    openModal('<p class="mtitle">📝 今日のSNS投稿案<small>' + j.m + "/" + j.d + "・" + SSTATE_LABEL[SSTATE] + "</small></p>" + draftCardsHTML());
  }
  var SHIBA_SVG = '<svg width="86" height="86" viewBox="0 0 100 100" aria-hidden="true"><polygon points="18,40 26,8 46,28" fill="#e89b4f"/><polygon points="82,40 74,8 54,28" fill="#e89b4f"/><polygon points="24,32 28,16 38,28" fill="#fff4e2"/><polygon points="76,32 72,16 62,28" fill="#fff4e2"/><circle cx="50" cy="54" r="36" fill="#e89b4f"/><ellipse cx="50" cy="68" rx="24" ry="18" fill="#fff4e2"/><ellipse cx="38" cy="38" rx="4" ry="2.5" fill="#fff4e2"/><ellipse cx="62" cy="38" rx="4" ry="2.5" fill="#fff4e2"/><circle cx="38" cy="50" r="3.6" fill="#2b2b2b"/><circle cx="62" cy="50" r="3.6" fill="#2b2b2b"/><circle cx="38" cy="50" r="9" fill="none" stroke="#5b3a29" stroke-width="2.4"/><circle cx="62" cy="50" r="9" fill="none" stroke="#5b3a29" stroke-width="2.4"/><line x1="47" y1="50" x2="53" y2="50" stroke="#5b3a29" stroke-width="2.4"/><ellipse cx="50" cy="62" rx="5" ry="3.6" fill="#2b2b2b"/><path d="M44 69 Q50 74 56 69" stroke="#2b2b2b" stroke-width="2" fill="none"/></svg>';
  var POM_SVG = '<svg width="86" height="86" viewBox="0 0 100 100" aria-hidden="true"><g fill="#d9b08a"><circle cx="50" cy="20" r="12"/><circle cx="34" cy="24" r="11"/><circle cx="66" cy="24" r="11"/><circle cx="20" cy="50" r="15"/><circle cx="80" cy="50" r="15"/><circle cx="18" cy="68" r="12"/><circle cx="82" cy="68" r="12"/></g><circle cx="50" cy="54" r="33" fill="#e3c09b"/><ellipse cx="50" cy="68" rx="15" ry="11" fill="#f7e6d0"/><circle cx="38" cy="50" r="5" fill="#2b2b2b"/><circle cx="62" cy="50" r="5" fill="#2b2b2b"/><circle cx="39.6" cy="48.2" r="1.6" fill="#fff"/><circle cx="63.6" cy="48.2" r="1.6" fill="#fff"/><ellipse cx="29" cy="62" rx="6" ry="3.6" fill="#f3a9b9" opacity=".8"/><ellipse cx="71" cy="62" rx="6" ry="3.6" fill="#f3a9b9" opacity=".8"/><ellipse cx="50" cy="63" rx="4.4" ry="3.4" fill="#2b2b2b"/><path d="M45 69 Q50 73 55 69" stroke="#2b2b2b" stroke-width="2" fill="none"/><ellipse cx="50" cy="73" rx="3" ry="3.4" fill="#f08aa3"/></svg>';
  function openIdCard(who) {

    [-1, 1].forEach(function (s) {
      var e = new THREE.Group(); e.position.set(s * 0.13, 0.04, 0.29);
      var eb = mesh(new THREE.SphereGeometry(0.058, 12, 10), BK, 0, 0, 0, false); eb.scale.z = 0.6; e.add(eb);
      e.add(mesh(new THREE.SphereGeometry(0.018, 8, 6), mat("#ffffff"), 0.018, 0.022, 0.03, false));
      pHead.add(e); pEyes.push(e);
    });
    [-1, 1].forEach(function (s) { var bl = mesh(new THREE.SphereGeometry(0.05, 10, 8), PK, s * 0.21, -0.08, 0.25, false); bl.scale.set(1.3, 0.7, 0.4); pHead.add(bl); });
    var pBrows = [];
    [-1, 1].forEach(function (s) { var b = mesh(new THREE.SphereGeometry(0.03, 8, 6), TN, s * 0.13, 0.15, 0.3, false); b.scale.set(1.5, 0.6, 0.5); b.visible = false; pHead.add(b); pBrows.push(b); });
    var pSweat = new THREE.Group();
    pSweat.add(mesh(new THREE.SphereGeometry(0.05, 12, 10), mat("#8fc8f2"), 0, 0, 0, false));
    pSweat.add(mesh(new THREE.ConeGeometry(0.05, 0.08, 12), mat("#8fc8f2"), 0, 0.055, 0, false));
    pSweat.position.set(-0.4, 0.12, 0.12); pSweat.visible = false; pHead.add(pSweat);
    if (SSTATE === "failed") {
      pSweat.visible = true; pTongue.visible = false;
      pSmile.rotation.z = 0; pSmile.position.y = -0.16;
      pBrows.forEach(function (b, i) { b.visible = true; b.rotation.z = i ? 0.5 : -0.5; });
    }
    pom.position.set(0, 0, -0.98);
    pom.scale.setScalar(1.12);
    mochiDesk.add(pom);
    pom.visible = mochiWorking;
    pom.userData.click = "mochi";

    // ---------------- カメラ操作 ----------------
    var TARGET = new THREE.Vector3(0, 1.2, -0.6);
    var AZ_MIN = -0.12, AZ_MAX = 1.68;
    var controls, usingOrbit = !!THREE.OrbitControls;
    var lastInteract = performance.now() - 10000, dragging = false;
    if (usingOrbit) {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.copy(TARGET);
      controls.enableDamping = true; controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.minDistance = 8; controls.maxDistance = 50;
      controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.32;
      controls.minAzimuthAngle = AZ_MIN; controls.maxAzimuthAngle = AZ_MAX;
      controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.8;
      controls.addEventListener("start", function () { dragging = true; });
      controls.addEventListener("end", function () { dragging = false; lastInteract = performance.now(); });
    } else {
      // OrbitControls が読み込めないときの簡単な回転・拡大
      controls = (function () {
        var off = camera.position.clone().sub(TARGET);
        var st = { r: off.length(), th: Math.atan2(off.x, off.z), ph: Math.acos(off.y / off.length()) };
        var el = renderer.domElement, down = null;
        el.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY }; dragging = true; });
        window.addEventListener("pointermove", function (e) {
          if (!down) return;
          st.th -= (e.clientX - down.x) * 0.006; st.ph -= (e.clientY - down.y) * 0.006;
          down = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener("pointerup", function () { if (down) { down = null; dragging = false; lastInteract = performance.now(); } });
        el.addEventListener("wheel", function (e) { e.preventDefault(); st.r *= e.deltaY > 0 ? 1.08 : 0.92; lastInteract = performance.now(); }, { passive: false });
        return {
          target: TARGET,
          getAzimuthalAngle: function () { return st.th; },
          rotate: function (d) { st.th += d; },
          update: function () {
            st.th = Math.min(AZ_MAX, Math.max(AZ_MIN, st.th));
            st.ph = Math.min(1.32, Math.max(0.35, st.ph));
            st.r = Math.min(50, Math.max(8, st.r));
            camera.position.set(TARGET.x + st.r * Math.sin(st.ph) * Math.sin(st.th), TARGET.y + st.r * Math.cos(st.ph), TARGET.z + st.r * Math.sin(st.ph) * Math.cos(st.th));
            camera.lookAt(TARGET);
          }
        };
      })();
    }
    // 画面サイズに合わせて最初の距離を調整（スマホでも全体が入るように）
    function fitDistance() {
      var a = window.innerWidth / window.innerHeight;
      var half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      var d = Math.max(7.2 / (half * a), 5.2 / half); // 部屋の横幅と高さが入る距離
      return Math.min(46, Math.max(15.5, d * 0.92));
    }
    (function () {
      var dir = camera.position.clone().sub(TARGET).normalize();
      camera.position.copy(TARGET).add(dir.multiplyScalar(fitDistance()));
    })();
    controls.update();

    var autoDir = 1;
    function autoRotate(dt) {
      if (dragging || performance.now() - lastInteract < 3500) return;
      var az = controls.getAzimuthalAngle();
      if (az > AZ_MAX - 0.03) autoDir = -1;
      if (az < AZ_MIN + 0.03) autoDir = 1;
      var d = autoDir * dt * 0.06;
      if (usingOrbit) {
        var off = camera.position.clone().sub(controls.target);
        off.applyAxisAngle(new THREE.Vector3(0, 1, 0), d);
        camera.position.copy(controls.target).add(off);
      } else controls.rotate(d);
    }

    // ---------------- クリック ----------------
    var ray = new THREE.Raycaster(); ray.camera = camera;
    var ptr = new THREE.Vector2(), downAt = null;
    var clickables = [tray, sTray];
    if (working) clickables.push(shiba);
    if (mochiWorking) clickables.push(pom);
    function pick(e) {
      var r = renderer.domElement.getBoundingClientRect();
      ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1; ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(ptr, camera); ray.camera = camera;
      var hits = ray.intersectObjects(clickables, true);
      for (var i = 0; i < hits.length; i++) {
        var o = hits[i].object;
        while (o && !o.userData.click) o = o.parent;
        if (o) return o;
      }
      return null;
    }
    var hovered = null;
    renderer.domElement.addEventListener("pointerdown", function (e) { downAt = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener("pointerup", function (e) {
      if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) { downAt = null; return; }
      downAt = null;
      var o = pick(e);
      if (!o) return;
      if (o.userData.click === "reports") openReports();
      if (o.userData.click === "drafts") openDrafts();
      if (o.userData.click === "employee") openIdCard("news");
      if (o.userData.click === "mochi") openIdCard("sns");
    });
    renderer.domElement.addEventListener("pointermove", function (e) {
      if (e.buttons) return;
      var o = pick(e);
      if (o !== hovered) {
        if (hovered) hovered.scale.setScalar(1);
        hovered = o;
        if (hovered) hovered.scale.setScalar(1.06);
        renderer.domElement.style.cursor = o ? "pointer" : "grab";
      }
    });
    renderer.domElement.style.cursor = "grab";

    // ---------------- 名札と吹き出し ----------------
    var labelsEl = document.getElementById("labels");
    var people = [
      { obj: shiba, show: working, name: EMP.name || "ニュースくん", msg: MESSAGE, trouble: STATE === "failed", cls: "" },
      { obj: pom, show: mochiWorking, name: SEMP.name || "もち", msg: SMESSAGE, trouble: SSTATE === "failed", cls: "mochi" }
    ];
    people.forEach(function (p) {
      p.tag = document.createElement("div"); p.tag.className = "float nametag " + p.cls; p.tag.textContent = p.name;
      p.bub = document.createElement("div"); p.bub.className = "float bubble" + (p.trouble ? " trouble" : ""); p.bub.textContent = p.msg || "";
      labelsEl.appendChild(p.tag); labelsEl.appendChild(p.bub);
      if (p.show) { p.tag.style.display = "block"; if (p.msg) p.bub.style.display = "block"; }
    });
    var v3 = new THREE.Vector3();
    function placeLabels() {
      var open = modal.classList.contains("open");
      people.forEach(function (p) {
        if (!p.show) return;
        p.obj.localToWorld(v3.set(0, 2.25, 0));
        v3.project(camera);
        var x = (v3.x * 0.5 + 0.5) * window.innerWidth, y = (-v3.y * 0.5 + 0.5) * window.innerHeight;
        p.tag.style.visibility = p.bub.style.visibility = (v3.z > 1 || open) ? "hidden" : "visible";
        var tx = Math.min(window.innerWidth - p.tag.offsetWidth - 6, Math.max(6, x - p.tag.offsetWidth / 2));
        p.tag.style.transform = "translate(" + Math.round(tx) + "px," + Math.round(y - p.tag.offsetHeight) + "px)";
        var bx = Math.max(8, Math.min(x + 34, window.innerWidth - p.bub.offsetWidth - 8));
        p.bub.style.transform = "translate(" + Math.round(bx) + "px," + Math.round(y - p.tag.offsetHeight - p.bub.offsetHeight - 6) + "px)";
      });
    }

    // ---------------- アニメーション ----------------
    var clockT = new THREE.Clock();
    var nextBlink = 1.5, blinkUntil = 0, skyTimer = 0, pNextBlink = 2.6, pBlinkUntil = 0;
    function animate() {
      requestAnimationFrame(animate);
      var dt = Math.min(clockT.getDelta(), 0.05), t = clockT.elapsedTime;
      autoRotate(dt);
      controls.update();
      tickClock();
      skyTimer += dt; if (skyTimer > 20) { skyTimer = 0; drawSky(); }
      if (working) {
        var speed = STATE === "failed" ? 5 : STATE === "nonews" ? 7 : 14;
        arms[0].rotation.x = 0.28 + Math.max(0, Math.sin(t * speed)) * 0.12;
        arms[1].rotation.x = 0.28 + Math.max(0, Math.sin(t * speed + Math.PI)) * 0.12;
        head.rotation.x = Math.sin(t * 1.6) * 0.03 + 0.08;
        head.rotation.z = STATE === "failed" ? 0.12 + Math.sin(t * 1.2) * 0.03 : Math.sin(t * 0.9) * 0.04;
        body.position.y = Math.sin(t * 2.2) * 0.008;
        tail.rotation.z = Math.sin(t * (STATE === "failed" ? 2 : 9)) * (STATE === "failed" ? 0.08 : 0.35);
        if (sweat.visible) sweat.position.y = 0.12 - ((t * 0.25) % 0.12);
        if (t > nextBlink) { blinkUntil = t + 0.13; nextBlink = t + 2.2 + Math.random() * 3; }
        var sy = t < blinkUntil ? 0.12 : 1;
        eyes[0].scale.y = eyes[1].scale.y = sy;
        var scr = empLap.userData.screen; scr.offset.y = (scr.offset.y + dt * (STATE === "failed" ? 0 : 0.05)) % 1;
      }
      if (mochiWorking) {
        var ps = SSTATE === "failed" ? 4 : 9;
        pArms[0].rotation.x = 0.3 + Math.max(0, Math.sin(t * ps + 0.7)) * 0.1;
        pArms[1].rotation.x = 0.3 + Math.max(0, Math.sin(t * ps + 0.7 + Math.PI)) * 0.1;
        pHead.rotation.z = SSTATE === "failed" ? -0.12 + Math.sin(t * 1.1) * 0.03 : Math.sin(t * 0.7) * 0.07;
        pHead.rotation.x = Math.sin(t * 1.3) * 0.03 + 0.06;
        pBody.position.y = Math.sin(t * 1.8 + 1) * 0.01;
        pTail.rotation.z = Math.sin(t * (SSTATE === "failed" ? 2 : 7)) * (SSTATE === "failed" ? 0.06 : 0.3);
        if (pSweat.visible) pSweat.position.y = 0.12 - ((t * 0.25) % 0.12);
        if (t > pNextBlink) { pBlinkUntil = t + 0.14; pNextBlink = t + 2.5 + Math.random() * 3; }
        var psy = t < pBlinkUntil ? 0.12 : 1;
        pEyes[0].scale.y = pEyes[1].scale.y = psy;
        var ms = mochiLap.userData.screen; ms.offset.y = (ms.offset.y + dt * (SSTATE === "failed" ? 0 : 0.04)) % 1;
      }
      badges.forEach(function (b, i) { b.position.y = 0.8 + (b.userData.lift || 0) + Math.sin(t * 2.4 + i * 1.3) * 0.05; });
      renderer.render(scene, camera);
      placeLabels();
    }
    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    document.getElementById("loading").style.display = "none";
    animate();
  }

  boot();
})();
</script>
</body>
