<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワンワンAIカンパニー オフィス</title>
<style>
  :root {
    --cream: #fff8ee;
    --paper: #ffffff;
    --ink: #4a3426;
    --ink-soft: #8a6d58;
    --shiba: #e89b4f;
    --shiba-deep: #c97a32;
    --mint: #8fd3b6;
    --pink: #e9a3b6;
    --pink-deep: #c9607e;
    --navy: #8aa3cf;
    --navy-deep: #3f5f99;
    --gold: #e8c46a;
    --gold-deep: #9a7210;
    --boss: #8d8f9e;
    --boss-deep: #3b3d4a;
    --line: #f0dcc4;
    --off: #e6d9c8;
    --shadow: 0 6px 24px rgba(120, 72, 30, .16);
    --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, #fffaf2 0%, #fbeedd 60%, #f3dfc6 100%);
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; outline: none; }

  /* 名札・吹き出し（3Dの位置に合わせて動かす） */
  .float { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; display: none; }
  .nametag {
    background: var(--paper); border: 2px solid var(--shiba); color: var(--ink);
    border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .nametag::before { content: "🐾 "; }
  .nametag.mochi { border-color: var(--pink); }
  .nametag.mochi::before { content: "🌸 "; }
  .nametag.bull { border-color: var(--navy); }
  .nametag.bull::before { content: "📋 "; }
  .nametag.kilt { border-color: var(--gold); }
  .nametag.kilt::before { content: "🧮 "; }
  .nametag.boss { border-color: var(--boss-deep); background: var(--boss-deep); color: #fff; }
  .nametag.boss::before { content: "社長 "; font-size: 11px; opacity: .8; }
  .bubble {
    background: var(--paper); color: var(--ink); border-radius: 16px; padding: 8px 14px;
    font-size: 14px; font-weight: 700; max-width: 240px; line-height: 1.45; box-shadow: var(--shadow);
    border: 2px solid var(--line);
  }
  .bubble::after {
    content: ""; position: absolute; left: -9px; bottom: 10px; border: 8px solid transparent;
    border-right-color: var(--paper); border-left: 0;
  }
  #hud, #hint { transition: opacity .25s; }
  #hud.faded, #hint.faded { opacity: .12; }
  #hud.faded:hover { opacity: 1; }
  .bubble.flip::after { left: auto; right: -9px; border-right: 0; border-left: 8px solid var(--paper); border-top-color: transparent; border-bottom-color: transparent; }
  .bubble.notail::after { display: none; }
  .bubble.trouble { border-color: #b9c7e8; }

  /* 画面の隅の小さな表示 */
  #hud {
    position: fixed; left: 14px; top: 14px; background: rgba(255,255,255,.88); backdrop-filter: blur(6px);
    border-radius: 18px; padding: 10px 14px; box-shadow: var(--shadow); min-width: 190px; z-index: 5;
  }
  #hud .co { font-weight: 800; font-size: 14px; letter-spacing: .02em; }
  #hud .co::before { content: "🐕 "; }
  #hud .date { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #hud .count { display: inline-flex; align-items: baseline; gap: 4px; margin-top: 6px; font-weight: 800; }
  #hud .count b { font-size: 26px; color: var(--shiba-deep); line-height: 1; }
  #hud .count.state b { font-size: 16px; }
  #hud .week { display: flex; gap: 6px; margin-top: 8px; }
  #hud .dot { width: 18px; text-align: center; font-size: 9px; color: var(--ink-soft); }
  #hud .dot i { display: block; width: 14px; height: 14px; margin: 0 auto 2px; border-radius: 50%; background: var(--off); }
  #hud .dot.on i { background: var(--shiba); box-shadow: 0 0 0 2px #fde3c6; }
  #hud .dot.gold.on i { background: var(--gold); box-shadow: 0 0 0 2px #f8edcc; }
  #hud .dot.navy.on i { background: var(--navy); box-shadow: 0 0 0 2px #dfe7f6; }
  #hud .dot.pink.on i { background: var(--pink); box-shadow: 0 0 0 2px #fbe1e8; }
  #hud .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  #hud .who b { color: var(--ink); font-size: 12px; }
  #hud .who .st { font-weight: 800; color: var(--shiba-deep); }
  #hud .who .st.pink { color: var(--pink-deep); }
  #hud .who .st.navy { color: var(--navy-deep); }
  #hud .who .st.gold { color: var(--gold-deep); }
  #hud .who .st.boss { color: var(--boss-deep); }
  #hud .who.boss { margin-top: 4px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
  #hud .dot.today i { outline: 2px solid var(--ink-soft); outline-offset: 1px; }
  #hint {
    position: fixed; right: 14px; bottom: 12px; font-size: 11px; color: var(--ink-soft);
    background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 999px; z-index: 5;
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink-soft); pointer-events: none; }

  /* 3Dが使えないときの表示 */
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 90px 16px 40px; overflow: auto;
  }
  #fallback .card { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; width: min(520px, 100%); }
  #fallback .note { font-size: 12px; color: var(--ink-soft); }
  #fallback .big { font-size: 22px; font-weight: 800; margin: 8px 0 12px; }
  #fallback .big.second { margin-top: 22px; font-size: 18px; }

  /* ポップアップ */
  #modal { position: fixed; inset: 0; background: rgba(74, 52, 38, .35); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal.open { display: flex; }
  #modal .sheet { background: var(--cream); border-radius: 22px; box-shadow: var(--shadow); width: min(480px, 100%); max-height: 88vh; overflow: auto; padding: 18px; position: relative; }
  #modal .close { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--ink-soft); }
  .mtitle { font-weight: 800; font-size: 17px; margin: 0 0 12px; }
  .mtitle small { font-weight: 400; color: var(--ink-soft); font-size: 12px; margin-left: 6px; }
  .ncard { display: flex; gap: 12px; align-items: center; background: var(--paper); border-radius: 16px; padding: 12px; margin-bottom: 10px; border: 2px solid var(--line); }
  .ncard .ic { font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; background: #fff3e4; border-radius: 12px; flex: none; }
  .ncard .hd { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .ncard.pink { border-color: #f6d3dc; }
  .ncard.pink .ic { background: #fdebef; }
  .btn.pink { background: var(--pink-deep); }
  .ncard.navy { border-color: #d5def0; }
  .ncard.navy .ic { background: #e9effa; }
  .btn.navy { background: var(--navy-deep); }
  .ncard.gold { border-color: #f1e2b6; }
  .ncard.gold .ic { background: #fbf3dc; }
  .ncard .num { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .btn.gold { background: var(--gold-deep); }
  .btn.boss { background: var(--boss-deep); }
  .chorei-msg { background: var(--paper); border-left: 4px solid var(--boss-deep); border-radius: 10px; padding: 10px 12px; font-weight: 700; margin-bottom: 10px; }
  .srow { display: flex; gap: 8px; align-items: baseline; background: var(--paper); border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
  .srow .mk { width: 22px; flex: none; text-align: center; }
  .srow b { flex: none; min-width: 6.5em; }
  .reqs { margin: 10px 0 4px; padding-left: 1.4em; font-size: 14px; }
  .reqs li { margin-bottom: 4px; }
  .note { font-size: 12px; color: var(--ink-soft); margin: 4px 0 8px; }
  .ncard .sub { font-size: 12px; color: var(--ink-soft); }
  .ncard a { font-size: 12px; color: var(--shiba-deep); word-break: break-all; }
  .btn { display: inline-block; margin-top: 6px; background: var(--shiba); color: #fff; font-weight: 800; text-decoration: none; padding: 9px 16px; border-radius: 999px; font-size: 14px; }
  .empty { background: var(--paper); border-radius: 16px; padding: 18px; text-align: center; font-weight: 700; margin-bottom: 10px; }
  .idcard { display: flex; gap: 14px; align-items: center; background: var(--paper); border-radius: 18px; padding: 14px; border-top: 10px solid var(--shiba); }
  .idcard svg { flex: none; }
  .idcard.mochi { border-top-color: var(--pink); }
  .idcard.bull { border-top-color: var(--navy); }
  .idcard.kilt { border-top-color: var(--gold); }
  .idcard.boss { border-top-color: var(--boss-deep); }
  .idcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .idcard dt { color: var(--ink-soft); }
  .idcard dd { margin: 0; font-weight: 700; }
  .idcard .nm { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  @media (max-width: 600px) {
    .bubble { max-width: 150px; font-size: 11px; padding: 6px 9px; border-radius: 12px; }
    .nametag { font-size: 11px; padding: 2px 9px; }
    #hud { padding: 8px 10px; min-width: 0; }
    #hud .count b { font-size: 20px; }
    #hud .week { gap: 3px; margin-top: 4px; }
    #hud .dot { width: 14px; font-size: 8px; }
    #hud .dot i { width: 10px; height: 10px; }
    #hud .who { margin-top: 5px; }
    #hud .dot { font-size: 0; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  // ---------- データの読み込み ----------
  var DATA;
  try { DATA = JSON.parse(document.getElementById("news-data").textContent); }
  catch (e) { DATA = { company: "ワンワンAIカンパニー", employee: { name: "番犬がおがお", role: "AIニュース担当", hours: "毎朝 7:00（日本時間）" }, days: [] }; }
  var EMP = DATA.employee || {};
  var FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif';

  // ---------- 日本時間 ----------
  var fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  function jst(d) {
    d = d || new Date();
    var o = {};
    fmt.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
    return { y: +o.year, m: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, ms: d.getMilliseconds() };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(y, m, d) { var t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() + "-" + pad(t.getUTCMonth() + 1) + "-" + pad(t.getUTCDate()); }
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  function weekday(y, m, d) { return WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; }

  var NOW = jst();
  var TODAY = ymd(NOW.y, NOW.m, NOW.d);
  var dayMap = {};
  (DATA.days || []).forEach(function (d) { dayMap[d.date] = d; });
  var today = dayMap[TODAY] || null;
  var news = (today && today.status === "reported" && today.news) ? today.news.slice(0, 5) : [];
  var STATE = !today ? "before" : (today.status === "search_failed" ? "failed" : (today.status === "reported" && news.length ? "reported" : "nonews"));

  var STATE_LABEL = { before: "出社前", reported: news.length + "件", nonews: "異常なし", failed: "検索失敗" };
  var DEFAULT_MSG = {
    before: "",
    reported: "2代目！今日は" + news.length + "件です！",
    nonews: "2代目！今日は新しいニュースはありません。異常なしです！",
    failed: "2代目、すみません…今日は検索がうまくいきませんでした"
  };
  var MESSAGE = (today && today.message) || DEFAULT_MSG[STATE];
  var CAT = {
    chatgpt: { icon: "💬", label: "ChatGPT" },
    claude: { icon: "✳️", label: "Claude" },
    image: { icon: "🎨", label: "画像生成" },
    efficiency: { icon: "⚡", label: "仕事効率化" },
    other: { icon: "📰", label: "その他" }
  };

  // ---------- もち（SNS投稿担当）のデータ ----------
  var SDATA;
  try { SDATA = JSON.parse(document.getElementById("sns-data").textContent); } catch (e) { SDATA = { days: [] }; }
  var SEMP = SDATA.employee || { name: "もち", role: "SNS投稿担当", hours: "毎朝 7:00（日本時間）" };
  var sDayMap = {};
  (SDATA.days || []).forEach(function (d) { sDayMap[d.date] = d; });
  var sToday = sDayMap[TODAY] || null;
  var drafts = (sToday && sToday.status === "drafted" && sToday.drafts) ? sToday.drafts.slice(0, 3) : [];
  var SSTATE = !sToday ? "before" : (sToday.status === "drafted" && drafts.length ? "drafted" : "failed");
  var SSTATE_LABEL = { before: "出社前", drafted: drafts.length + "案", failed: "作成失敗" };
  var SMESSAGE = (sToday && sToday.message) || {
    before: "",
    drafted: "2代目〜、今日の投稿案を" + drafts.length + "つご用意しましたよ〜",
    failed: "2代目、すみません…今日はうまく作れませんでした〜"
  }[SSTATE];

        kBody.position.y = Math.sin(t * 2.4) * 0.008;
        kTail.rotation.z = Math.sin(t * (KSTATE === "failed" ? 2 : 11)) * 0.4;
        if (kSweat.visible) kSweat.position.y = 0.08 - ((t * 0.25) % 0.12);
        if (KSTATE === "done") beads.forEach(function (bd, i) { bd.position.z = -0.03 + Math.max(0, Math.sin(t * 3 + i * 1.7)) * 0.03; });
        if (t > kNextBlink) { kBlinkUntil = t + 0.13; kNextBlink = t + 2 + Math.random() * 2.5; }
        var ksy = t < kBlinkUntil ? 0.12 : 1;
        kEyes[0].scale.y = kEyes[1].scale.y = ksy;
      }
      if (bossWorking) {
        oBody.scale.y = 1 + Math.sin(t * 1.1) * 0.012; // ゆっくり深い呼吸
        if (CSTATE !== "failed") {
          oNod = (t % 7 < 0.8) ? Math.sin((t % 7) / 0.8 * Math.PI) * 0.18 : 0; // ときどき、黙ってうなずく
          oHead.rotation.x = 0.04 + oNod;
          oHead.rotation.y = Math.sin(t * 0.25) * 0.12;
        }
        if (t > oNextBlink) { oBlinkUntil = t + 0.15; oNextBlink = t + 4 + Math.random() * 3; }
        var osy = t < oBlinkUntil ? 0.15 : 1;
        oEyes[0].scale.y = oEyes[1].scale.y = osy;
      }
      badges.forEach(function (b, i) { b.position.y = 0.42 + (b.userData.lift || 0) + Math.sin(t * 2.4 + i * 1.3) * 0.04; });
      renderer.render(scene, camera);
      placeLabels();
    }
    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    document.getElementById("loading").style.display = "none";
    animate();
  }

  boot();
})();
</script>
</body>
</html>
